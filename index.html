<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nido">
<meta name="theme-color" content="#0b0d17">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Nido · Casa en equipo</title>
<style>
:root{--bg:#0b0d17;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.08);--txt:#f4f5fb;--mut:#9aa0b8;--acc:#7c5cff;--acc2:#22d3a6;--warn:#ffb547;--day:#ff3b6b;--week:#22d3a6;--month:#3fb5ff;--r:24px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Display","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(900px 500px at 10% -10%,rgba(124,92,255,.28),transparent 60%),radial-gradient(700px 500px at 110% 10%,rgba(34,211,166,.14),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
select option{background:#1a1d2e}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 112px)}
h1{font-size:30px;margin:0;letter-spacing:-.6px;font-weight:850}
h2{font-size:19px;margin:28px 2px 12px;letter-spacing:-.3px;font-weight:780;display:flex;align-items:center;justify-content:space-between}
h2 small{font-size:13px;color:var(--mut);font-weight:500}
.mut{color:var(--mut)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top>button{display:grid;place-items:center;padding:0}
.date{color:var(--mut);font-size:15px;margin-top:4px}
.date::first-letter{text-transform:uppercase}
.av{--c:#7c5cff;line-height:1;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--c) 30%,transparent) center/cover no-repeat;box-shadow:inset 0 0 0 2px var(--c);font-size:19px;flex:none}
.av.ph{box-shadow:0 0 0 2px var(--c)}
.av.sm{width:26px;height:26px;font-size:13px}
.av.lg{width:50px;height:50px;font-size:25px}
.av.xl{width:96px;height:96px;font-size:46px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
/* Historias */
.stories{display:flex;gap:14px;overflow-x:auto;margin:0 -18px 0;padding:4px 18px 6px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;width:70px}
.story .rw{position:relative;width:70px;height:70px;display:grid;place-items:center}
.story svg{position:absolute;inset:0;transform:rotate(-90deg)}
.story .av{width:56px;height:56px;font-size:28px;box-shadow:none}
.story .nm{font-size:12px;font-weight:650;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story .ct{font-size:11px;color:var(--mut);margin-top:-3px}
.story.full .ct{color:var(--acc2);font-weight:700}
.story .away{position:absolute;right:0;bottom:2px;font-size:15px;background:#151829;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
/* Anillos */
.hero{margin-top:16px;display:flex;align-items:center;gap:16px;padding:18px;border-radius:var(--r);background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--line)}
.rings{width:150px;height:150px;flex:none;position:relative}
.rings svg{transform:rotate(-90deg)}
.rings circle.f{animation:fill 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes fill{from{stroke-dashoffset:var(--full)}}
.rings .ctr{position:absolute;inset:0;display:grid;place-items:center;font-size:24px}
.legend{flex:1;min-width:0}
.legend .t{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--mut);font-weight:750;margin-bottom:8px}
.lgd{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.lgd i{width:10px;height:10px;border-radius:50%;flex:none;transform:translateY(-1px)}
.lgd b{font-size:22px;letter-spacing:-.5px}
.lgd span{font-size:13px;color:var(--mut)}
.goal{margin-top:10px;font-size:13px;line-height:1.35;padding:8px 10px;border-radius:12px;background:rgba(255,181,71,.12);color:#ffd08a}
.goal.won{background:rgba(34,211,166,.16);color:#7ff0cf}
.quote{margin-top:14px;padding:18px 20px;border-radius:var(--r);background:linear-gradient(135deg,#7c5cff 0%,#5a3fd6 45%,#1fb894 130%);box-shadow:0 18px 40px -18px rgba(124,92,255,.7);position:relative;overflow:hidden}
.quote:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.quote .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;opacity:.85;font-weight:750}
.quote p{font-size:19px;line-height:1.35;margin:6px 0 0;font-weight:700;position:relative;z-index:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.stat b{font-size:22px;letter-spacing:-.5px}
.stat span{display:block;font-size:12px;color:var(--mut);margin-top:2px}
/* Tareas */
.task{display:flex;align-items:center;gap:12px;padding:14px;border-radius:22px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;transition:transform .15s,opacity .3s}
.task:active{transform:scale(.98)}
.task .ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:var(--card2);flex:none}
.task .bd{flex:1;min-width:0}
.task .nm{font-weight:700;font-size:16px}
.task .meta{font-size:13px;color:var(--mut);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--txt);font-weight:650}
.pill.pts{background:rgba(255,181,71,.16);color:var(--warn)}
.pill.time{background:rgba(63,181,255,.15);color:#7cc8ff}
.pill.sw{background:rgba(124,92,255,.2);color:#b9a8ff}
.chk{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.22);display:grid;place-items:center;flex:none;transition:.2s}
.chk svg{opacity:0;transition:.2s}
.task.done{opacity:.55}
.task.done .nm{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.4)}
.task.done .chk{background:var(--acc2);border-color:var(--acc2);box-shadow:0 0 18px rgba(34,211,166,.5)}
.task.done .chk svg{opacity:1}
.mini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--mut);background:var(--card2);flex:none;font-size:15px}
.tip{font-size:14px;line-height:1.45;color:#d6d9ee;background:rgba(124,92,255,.12);border:1px solid rgba(124,92,255,.25);border-radius:16px;padding:11px 13px;margin:-4px 0 12px}
.benefit{display:flex;gap:14px;align-items:flex-start}
.benefit .e{font-size:30px}
.benefit p{margin:4px 0 0;font-size:14.5px;line-height:1.45;color:#d6d9ee}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--c,#7c5cff);transition:width .5s}
/* Nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(530px,calc(100% - 24px));display:flex;justify-content:space-around;padding:8px;border-radius:28px;background:rgba(22,24,40,.8);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--line);z-index:20;box-shadow:0 20px 40px -10px rgba(0,0,0,.6)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);padding:7px 6px;border-radius:20px;flex:1;font-weight:650;position:relative}
.nav button.on{color:var(--txt);background:rgba(124,92,255,.22)}
.nav svg{width:23px;height:23px}
.nav .dot{position:absolute;top:4px;right:calc(50% - 18px);min-width:17px;height:17px;border-radius:9px;background:var(--day);font-size:10px;color:#fff;display:grid;place-items:center;padding:0 4px}
/* Semana */
.day{margin-bottom:16px}
.day h3{font-size:15px;margin:0 0 8px 4px;color:var(--mut);font-weight:700}
.day h3::first-letter{text-transform:uppercase}
.day h3.today{color:var(--acc2)}
.wk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14.5px}
.wk:last-child{border-bottom:0}
.wk .e{font-size:19px;width:26px;text-align:center}
.wk .n{flex:1}
.wk.ok .n{color:var(--mut);text-decoration:line-through}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:16px 0}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:650;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--txt)}
/* Feed */
.feed{padding:14px;border-radius:22px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.feed .hd{display:flex;gap:12px;align-items:center}
.feed .t{flex:1;font-size:14.5px;line-height:1.4}
.feed .w{font-size:12px;color:var(--mut);margin-top:2px}
.rx{display:flex;gap:6px;margin-top:10px;padding-left:50px}
.rx button{padding:5px 10px;border-radius:99px;background:var(--card2);font-size:14px;border:1px solid transparent;transition:transform .15s}
.rx button:active{transform:scale(1.25)}
.rx button.me{background:rgba(124,92,255,.25);border-color:rgba(124,92,255,.6)}
.rx small{font-size:12px;font-weight:700;margin-left:3px}
.rank{display:flex;align-items:center;gap:12px;padding:14px;border-radius:22px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.rank .pos{font-size:22px;width:30px;text-align:center;font-weight:800}
.rank .bd{flex:1}
.rank .p{font-weight:850;font-size:20px}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.empty .e{font-size:44px;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:16px;background:var(--acc);font-weight:750;color:#fff;width:100%;text-decoration:none}
.btn.ghost{background:var(--card2)}
.btn.danger{background:rgba(255,90,110,.16);color:#ff7d8f}
.btn.ok{background:rgba(34,211,166,.18);color:#7ff0cf}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .bd{flex:1;min-width:0}
.list .it .s{font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.35}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--mut);margin:0 0 6px 4px;font-weight:650}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--card2);font-size:14px;color:var(--txt);margin:0}
.checks input{width:auto}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sheet{width:min(560px,100%);max-height:90vh;overflow:auto;background:#151829;border-radius:30px 30px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 22px);border:1px solid var(--line);animation:up .3s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);margin:4px auto 14px}
.sheet h3{margin:0 0 14px;font-size:20px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px;border-radius:16px;background:var(--card);margin-bottom:8px;text-align:left;font-size:15.5px;font-weight:650}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);background:rgba(30,33,52,.96);border:1px solid var(--line);padding:12px 18px;border-radius:18px;z-index:80;font-size:14.5px;font-weight:650;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:tin .3s;max-width:90%}
@keyframes tin{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
.banner{font-size:13px;padding:10px 14px;border-radius:14px;background:rgba(255,181,71,.12);border:1px solid rgba(255,181,71,.3);color:#ffd08a;margin-top:14px;line-height:1.4}
.who{position:fixed;inset:0;z-index:50;overflow:auto;display:flex;flex-direction:column;justify-content:center;padding:30px 24px;background:radial-gradient(700px 500px at 50% -10%,rgba(124,92,255,.35),transparent 60%),var(--bg)}
.who h1{text-align:center;font-size:34px}
.who p{text-align:center;color:var(--mut);margin:8px 0 26px}
.who .opt{padding:14px}
.win{position:fixed;inset:0;z-index:65;display:grid;place-items:center;background:rgba(11,13,23,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fd .3s;text-align:center;padding:30px}
.win .big{font-size:92px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.win h1{font-size:34px;margin-top:6px}
.win p{color:var(--mut);font-size:16px;margin:10px 0 24px}
@keyframes pop{from{transform:scale(.2) rotate(-20deg)}to{transform:none}}
.away-tag{font-size:12px;color:#ffb3c2;background:rgba(255,59,107,.15);padding:3px 8px;border-radius:99px;font-weight:650}
.brand{font-size:24px;font-weight:900;letter-spacing:-.6px;background:linear-gradient(90deg,#c3b5ff,#7ff0cf);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);-webkit-text-fill-color:var(--mut);font-weight:700;margin-top:1px}
.bigdate{display:flex;align-items:center;gap:14px;margin-top:14px}
.bigdate .num{font-size:68px;font-weight:900;line-height:.85;letter-spacing:-3px;background:linear-gradient(180deg,#fff,#b9b3d8);-webkit-background-clip:text;background-clip:text;color:transparent}
.bigdate .wd{font-size:22px;font-weight:850;letter-spacing:-.3px}
.bigdate .wd::first-letter,.bigdate .mo::first-letter{text-transform:uppercase}
.bigdate .mo{font-size:15px;color:var(--mut);margin-top:2px}
.hint{font-size:12px;color:var(--mut);text-align:center;margin-top:4px}
.pbar{margin:-2px 2px 16px}
.pbar .pb{height:14px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.pbar .pb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7c5cff,#22d3a6);transition:width .7s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden;min-width:14px}
.pbar .pb i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 2.2s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.pbar .lb{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:7px;font-weight:600}
.pbar .lb b{color:var(--txt)}
.task .tipl{font-size:13px;line-height:1.42;color:#c9c0ff;margin-top:7px}
.wis{transition:opacity .45s,transform .45s;background:linear-gradient(135deg,#ff8a4c 0%,#ff5f7e 55%,#b44dff 130%) !important;border:0 !important;box-shadow:0 18px 40px -18px rgba(255,110,100,.7);position:relative;overflow:hidden;padding:18px 20px !important}
.wis:after{content:"";position:absolute;left:-50px;bottom:-60px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.wis .k{color:rgba(255,255,255,.85) !important}
.wis .benefit{position:relative;z-index:1}
.wis .benefit b{font-size:17px;color:#fff;text-shadow:0 1px 6px rgba(120,20,40,.35)}
.wis .benefit p{color:#fff !important;font-size:15px;font-weight:550;text-shadow:0 1px 6px rgba(120,20,40,.35)}
.wis .benefit .e{font-size:34px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.wis .wisbar{background:rgba(255,255,255,.25) !important;position:relative;z-index:1}
.wis .wisbar i{background:#fff !important}
.wis.out{opacity:0;transform:translateY(8px)}
.wis .k{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--mut);font-weight:750;margin-bottom:6px}
.wisbar{height:3px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:14px;overflow:hidden}
.wisbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c5cff,#22d3a6);animation:wb 10s linear forwards}
@keyframes wb{to{width:100%}}
.splash{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:#0b0d17 center/cover no-repeat;transition:opacity .7s;text-align:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.splash.hide{opacity:0;pointer-events:none}
.sp-img{width:100%;max-width:560px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent,#000 14%,#000 78%,transparent);mask-image:linear-gradient(180deg,transparent,#000 14%,#000 78%,transparent)}
.sp-img img{display:block;width:100%;animation:kb 3s ease-out both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.splash .tx{position:relative;z-index:2;animation:rise 1s cubic-bezier(.2,.9,.3,1) both .25s;padding:0 24px}
.splash h1{font-size:68px;letter-spacing:-2px;line-height:1;background:linear-gradient(90deg,#c3b5ff,#7ff0cf);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(124,92,255,.55))}
.sp-who{font-size:24px;font-weight:800;margin-top:10px;color:#fff}
.splash p{color:#d6d0f5;font-size:16px;line-height:1.45;margin:12px 0 0;font-style:italic}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
.wkc{padding:14px;border-radius:22px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.wkc.first{background:linear-gradient(135deg,rgba(255,181,71,.18),rgba(124,92,255,.12));border-color:rgba(255,181,71,.4)}
.wkc .hd{display:flex;align-items:center;gap:12px}
.wkc .bd{flex:1;min-width:0}
.wkc .pct{font-size:26px;font-weight:900;letter-spacing:-1px}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.badge{font-size:11.5px;padding:3px 8px;border-radius:99px;background:rgba(124,92,255,.2);color:#d3c9ff;font-weight:700}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.dots div{text-align:center;font-size:10.5px;color:var(--mut);font-weight:700}
.dots span{display:grid;place-items:center;height:26px;border-radius:9px;margin-top:4px;font-size:12px;background:rgba(255,255,255,.06)}
.dots .g{background:#22d3a6;color:#0b0d17}
.dots .y{background:#ffb547;color:#0b0d17}
.dots .r{background:rgba(255,59,107,.5);color:#fff}
.dots .f{background:transparent;border:1px dashed rgba(255,255,255,.14)}
.prize{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:20px;background:linear-gradient(135deg,#ffb547,#ff7a59);color:#1b1205;margin:14px 0;font-weight:750;box-shadow:0 14px 30px -14px rgba(255,150,70,.7)}
.prize .e{font-size:30px}
.prize small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;opacity:.75}
.plan{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed;font-size:12.5px;margin:0 -3px}
.plan th{font-weight:700;color:var(--mut);font-size:11px;padding:4px 0;text-align:center}
.plan th b{display:block;font-size:15px;color:var(--txt);margin-top:1px}
.plan th.tod{color:var(--acc2)} .plan th.tod b{color:var(--acc2)}
.plan td.tn{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:2px;font-size:12.5px}
.plan td.tn small{color:var(--mut);font-weight:500}
.plan td.cl{text-align:center;padding:0}
.pc{position:relative;width:100%;height:38px;border-radius:11px;background:rgba(255,255,255,.05);display:grid;place-items:center;border:1px solid transparent}
.pc.tod{background:rgba(34,211,166,.08)}
.pc.ok{background:rgba(34,211,166,.18);border-color:rgba(34,211,166,.4)}
.pc.mv{border-color:rgba(255,181,71,.7)}
.pc .av{width:28px;height:28px;font-size:15px}
.pc .x{position:absolute;right:2px;top:2px;width:7px;height:7px;border-radius:50%;background:#b9a8ff}
.pc .ck{position:absolute;right:-1px;bottom:-1px;font-size:11px;background:#151829;border-radius:50%;width:15px;height:15px;display:grid;place-items:center}
.pc.none{background:transparent;border:1px dashed rgba(255,255,255,.08)}
.wnav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
.wnav b{font-size:15px}
.loads{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.loads span{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:650}
.loads .av{width:24px;height:24px;font-size:13px}
.legend2{font-size:12px;color:var(--mut);line-height:1.6;margin-top:12px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
</style>
</head>

<script type="module">
/* ===== Motor (copia de engine.js, incluida aquí para que la app sea un solo archivo) ===== */
// engine.js — lógica compartida entre la app (navegador) y el servidor (Firebase Functions)
// Si cambias este archivo, copia el mismo archivo a functions/engine.js

const ANCHOR = new Date(2026, 0, 5); // lunes de referencia para las rotaciones
const DOW = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const DEFAULT_NOTIF = { morning: '08:00', evening: '20:00', before: 10, done: true };

const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = (now = new Date()) => new Date(now.getFullYear(), now.getMonth(), now.getDate());
const dayIdx = d => Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - ANCHOR) / 864e5);
const monthIdx = d => (d.getFullYear() - 2026) * 12 + d.getMonth();
const weekStart = d => addDays(today(d), -((d.getDay() + 6) % 7));
const daysInMonth = d => new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
const toMin = s => { const [h, m] = String(s || '').split(':').map(Number); return Number.isFinite(h) ? h * 60 + (m || 0) : null; };

// db = { cfg: {members, tasks}, comps: Map(key -> registro), ovr: Map(base -> memberId) }
function createEngine(db) {
  const members = () => db.cfg.members || [];
  const mById = id => members().find(m => m.id === id) || { id, name: 'Ex-miembro', emoji: '👤', color: '#666a80' };
  const available = (m, d) => !(m.offDays || []).includes(d.getDay()) && !(m.away || []).includes(keyOf(d));
  const eligibleAll = t => t.everyone ? members() : members().filter(m => (t.members || []).includes(m.id));
  function eligibleOn(t, d) {
    let el = eligibleAll(t).filter(m => available(m, d));
    // Si nadie de los asignados está, la tarea pasa a quienes sí estén en casa
    if (!el.length && t.mode !== 'each') el = members().filter(m => available(m, d));
    return el;
  }
  function occursOn(t, d) {
    const f = t.freq || { type: 'daily' };
    if (f.type === 'daily') return true;
    if (f.type === 'every') { const n = Math.max(1, +f.n || 1); return ((dayIdx(d) - (f.start || 0)) % n + n) % n === 0; }
    if (f.type === 'weekly') return d.getDay() === +f.dow;
    if (f.type === 'monthly') return d.getDate() === Math.min(+f.dom || 1, daysInMonth(d));
    return false;
  }
  function occIndex(t, d) {
    const f = t.freq || {};
    if (f.type === 'every') return Math.floor((dayIdx(d) - (f.start || 0)) / Math.max(1, +f.n || 1));
    if (f.type === 'weekly') return Math.floor(dayIdx(d) / 7);
    if (f.type === 'monthly') return monthIdx(d);
    return dayIdx(d);
  }
  let cache = new Map();
  const reset = () => { cache = new Map(); };
  // Plantilla semanal del admin: plan[taskId][díaSemana][turno] = memberId ('' = no toca)
  const planFor = t => (t.mode !== 'each' && db.cfg.plan && db.cfg.plan[t.id]) || null;
  function instancesFor(d) {
    const dk = keyOf(d);
    if (cache.has(dk)) return cache.get(dk);
    const out = [];
    for (const t of db.cfg.tasks || []) {
      const pl = planFor(t);
      if (!pl && !occursOn(t, d)) continue;
      const slots = (t.times && t.times.length) ? t.times : [null];
      if (t.mode === 'each') {
        const el = eligibleOn(t, d);
        slots.forEach((time, si) => el.forEach(m => { const key = `${dk}|${t.id}|${si}|${m.id}`; out.push({ t, si, time, member: m.id, key, base: key, done: db.comps.get(key) }); }));
        continue;
      }
      slots.forEach((time, si) => {
        const base = `${dk}|${t.id}|${si}`, key = base + '|-', ov = db.ovr.get(base);
        if (ov === '-') return; // "no toca" solo esta semana
        let member = null, moved = false;
        const rot = list => list[(((occIndex(t, d) * slots.length + si + (t.offset || 0)) % list.length) + list.length) % list.length].id;
        if (ov && members().some(m => m.id === ov)) member = ov;
        else if (pl) {
          const pm = ((pl[d.getDay()] || [])[si]) || '';
          if (!pm) return;
          const pmM = members().find(m => m.id === pm);
          if (pmM && available(pmM, d)) member = pm;
          else { // la persona planeada no está: se pasa a quien sí esté
            let el = eligibleOn(t, d).filter(m => m.id !== pm);
            if (!el.length) el = members().filter(m => available(m, d));
            if (!el.length) return;
            member = rot(el); moved = true;
          }
        } else {
          const el = eligibleOn(t, d); if (!el.length) return;
          member = t.mode === 'fixed' ? el[0].id : rot(el);
        }
        out.push({ t, si, time, member, key, base, overridden: !!ov, planned: !!pl, moved, done: db.comps.get(key) });
      });
    }
    out.sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
    cache.set(dk, out);
    return out;
  }
  function progress(from, to, mid) {
    let done = 0, total = 0;
    for (let d = today(from); d <= to; d = addDays(d, 1)) {
      for (const x of instancesFor(d)) { if (mid && x.member !== mid) continue; total++; if (x.done) done++; }
    }
    return { done, total, pct: total ? done / total : 0 };
  }
  function pointsBetween(mid, from, to) {
    const a = keyOf(from), b = keyOf(to); let p = 0;
    for (const r of db.comps.values()) if (r.by === mid && r.date >= a && r.date <= b) p += +r.points || 0;
    return p;
  }
  function streak(mid, now = new Date()) {
    let s = 0;
    for (let i = 0; i < 40; i++) {
      const inst = instancesFor(addDays(today(now), -i)).filter(x => x.member === mid);
      if (!inst.length) continue;
      if (inst.every(x => x.done)) s++; else if (i === 0) continue; else break;
    }
    return s;
  }
  return { members, mById, available, eligibleAll, eligibleOn, occursOn, planFor, instancesFor, progress, pointsBetween, streak, reset };
}

// Qué alertas tocan en este momento. `sent` = Set de etiquetas ya enviadas hoy.
// Ventana de 60 min: si el servidor se retrasa, la alerta igual sale (una sola vez).
function planNotifications(eng, now, sent = new Set()) {
  const d = today(now), dk = keyOf(d), nowMin = now.getHours() * 60 + now.getMinutes();
  const due = t => t != null && nowMin >= t && nowMin - t < 60;
  const list = x => x.map(i => `${i.t.emoji} ${i.t.name}${i.time ? ' (' + i.time + ')' : ''}`).join(', ');
  const out = [];
  eng.reset();
  for (const m of eng.members()) {
    const p = { ...DEFAULT_NOTIF, ...(m.notif || {}) };
    const mine = eng.instancesFor(d).filter(x => x.member === m.id);
    if (!mine.length) continue;
    const first = (m.name || '').length <= 11 ? m.name : m.name.split(' ')[0];
    if (p.morning && due(toMin(p.morning)))
      out.push({ to: m.id, tag: `${dk}|am|${m.id}`, title: `☀️ ¡Buenos días, ${first}! Hoy te toca:`, body: list(mine) });
    for (const x of mine) {
      if (!x.time || x.done) continue;
      if (due(toMin(x.time) - (+p.before || 0)))
        out.push({ to: m.id, tag: `${dk}|t|${x.key}`, title: `${x.t.emoji} ${x.t.name} a las ${x.time}`, body: `${first}, te toca a ti. ¡Al tiro! 💪` });
    }
    const pending = mine.filter(x => !x.done);
    if (p.evening && pending.length && due(toMin(p.evening)))
      out.push({ to: m.id, tag: `${dk}|pm|${m.id}`, title: `🌙 ${first}, todavía te falta:`, body: list(pending) + ' — ¡no rompas la racha! 🔥' });
  }
  return out.filter(n => !sent.has(n.tag));
}

// Calendario .ics de una persona (para suscribirse desde el iPhone o Google Calendar)
function buildICS(eng, memberId, days = 30, now = new Date()) {
  const m = eng.mById(memberId);
  const p = { ...DEFAULT_NOTIF, ...(m.notif || {}) };
  const escI = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Nido//Casa en equipo//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    `X-WR-CALNAME:Nido · ${escI(m.name)}`, 'REFRESH-INTERVAL;VALUE=DURATION:PT1H', 'X-PUBLISHED-TTL:PT1H'];
  eng.reset();
  for (let i = 0; i < days; i++) {
    const d = addDays(today(now), i);
    for (const x of eng.instancesFor(d).filter(x => x.member === memberId)) {
      const [hh, mm] = (x.time || p.morning || '09:00').split(':');
      const ds = `${keyOf(d).replace(/-/g, '')}T${pad(+hh)}${pad(+mm)}00`;
      L.push('BEGIN:VEVENT', `UID:${x.key.replace(/\|/g, '-')}@nido`, `DTSTAMP:${stamp}`, `DTSTART:${ds}`, 'DURATION:PT30M',
        `SUMMARY:${escI(x.t.emoji + ' ' + x.t.name)}`, `DESCRIPTION:${escI((x.t.tips || [])[0] || 'Te toca hoy. ¡Tú puedes!')}`,
        'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${escI(x.t.name)}`, `TRIGGER:-PT${+p.before || 0}M`, 'END:VALARM', 'END:VEVENT');
    }
  }
  L.push('END:VCALENDAR');
  return L.join('\r\n') + '\r\n';
}

  hoy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  semana: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>',
  feed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',
  ranking: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>',
  ajustes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
};
const CHECK = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0b0d17" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const okPhoto = p => typeof p === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p);
const av = (m, cls = '') => okPhoto(m.photo)
  ? `<span class="av ph ${cls}" style="--c:${esc(m.color)};background-image:url(${m.photo})"></span>`
  : `<span class="av ${cls}" style="--c:${esc(m.color)}">${esc(m.emoji)}</span>`;
const freqText = f => !f ? '' : f.type === 'daily' ? 'Diario' : f.type === 'every' ? `Cada ${f.n} días` : f.type === 'weekly' ? `Cada ${DOW[f.dow].toLowerCase()}` : `Día ${f.dom} de cada mes`;
const modeText = m => m === 'each' ? 'Cada quien la suya' : m === 'fixed' ? 'Persona fija' : 'Se turnan';
const ring = (r, pct, color, w) => { const C = 2 * Math.PI * r; return `<circle cx="75" cy="75" r="${r}" stroke="${color}" stroke-opacity=".18" stroke-width="${w}" fill="none"/><circle class="f" cx="75" cy="75" r="${r}" stroke="${color}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - Math.min(1, pct))}" style="--full:${C}"/>`; };

function renderNav() {
  const pend = eng.instancesFor(today()).filter(x => x.member === me && !x.done).length;
  const tabs = [['hoy', 'Hoy'], ['semana', 'Semana'], ['feed', 'Actividad'], ['ranking', 'Ranking'], ['ajustes', 'Ajustes']];
  $nav.innerHTML = tabs.map(([k, l]) => `<button data-tab="${k}" class="${ui.tab === k ? 'on' : ''}">${IC[k]}${l}${k === 'hoy' && pend ? `<span class="dot">${pend}</span>` : ''}</button>`).join('');
}

function render() {
  eng.reset();
  if (!db.ready) { $app.innerHTML = '<div class="empty"><div class="e">🏡</div>Cargando la casa…</div>'; return; }
  if (!me || !members().some(m => m.id === me)) return renderWho();
  document.querySelector('.who')?.remove();
  renderNav();
  ({ hoy: renderHoy, semana: renderSemana, feed: renderFeed, ranking: renderRanking, ajustes: renderAjustes })[ui.tab]();
}

function renderWho() {
  let w = document.querySelector('.who');
  if (!w) { w = document.createElement('div'); w.className = 'who'; document.body.appendChild(w); }
  w.innerHTML = `<div style="font-size:60px;text-align:center">🏡</div><h1>Nido</h1><p>La casa en equipo. ¿Quién eres?</p>
    ${members().map(m => `<button class="opt" data-act="pickme" data-id="${m.id}">${av(m)} ${esc(m.name)}</button>`).join('')}`;
}

function taskCard(x) {
  const tips = x.t.tips || [];
  const tip = tips[Math.abs(dayIdx(today())) % Math.max(1, tips.length)];
  const by = x.done && x.done.by !== x.member ? ` · la hizo ${esc(first(mById(x.done.by)))}` : '';
  return `<div class="task ${x.done ? 'done' : ''}">
    <div class="ic">${esc(x.t.emoji)}</div>
    <div class="bd"><div class="nm">${esc(x.t.name)}</div>
      <div class="meta">${x.time ? `<span class="pill time">⏰ ${x.time}</span>` : ''}<span class="pill pts">+${x.t.points}</span>${x.overridden ? '<span class="pill sw">⇄ cambio</span>' : ''}${x.done ? `<span>✓ ${ago(x.done.at)}${by}</span>` : ''}</div>
      ${tip && !x.done ? `<div class="tipl">💡 ${esc(tip)}</div>` : ''}</div>
    <button class="mini" data-act="other" data-k="${x.key}" aria-label="Opciones">⋯</button>
    <button class="chk" data-act="toggle" data-k="${x.key}" aria-label="Hecha">${CHECK}</button>
  </div>`;
}

function houseRings() {
  const t = today();
  // Los anillos cuentan desde que la casa empezó a usar la app
  const st = db.cfg.startDate ? fromKey(db.cfg.startDate) : t;
  const from = x => x < st ? st : x;
  const d = eng.progress(t, t), w = eng.progress(from(weekStart(t)), addDays(weekStart(t), 6));
  const mo = eng.progress(from(new Date(t.getFullYear(), t.getMonth(), 1)), new Date(t.getFullYear(), t.getMonth(), daysInMonth(t)));
  const g = db.cfg.goals || {};
  const left = w.total - w.done;
  const pct = p => Math.round(p.pct * 100);
  return `<div class="hero">
    <div class="rings"><svg viewBox="0 0 150 150" width="150" height="150">${ring(64, mo.pct, 'var(--month)', 13)}${ring(48, w.pct, 'var(--week)', 13)}${ring(32, d.pct, 'var(--day)', 13)}</svg><div class="ctr">🏡</div></div>
    <div class="legend"><div class="t">La casa</div>
      <div class="lgd"><i style="background:var(--day)"></i><b>${pct(d)}%</b><span>hoy</span></div>
      <div class="lgd"><i style="background:var(--week)"></i><b>${pct(w)}%</b><span>semana</span></div>
      <div class="lgd"><i style="background:var(--month)"></i><b>${pct(mo)}%</b><span>mes</span></div>
      ${g.week ? `<div class="goal ${left <= 0 ? 'won' : ''}">${left <= 0 ? `🎉 ¡Meta desbloqueada! ${esc(g.week)}` : `🎯 ${esc(g.week)} · faltan ${left} tareas`}</div>` : ''}
    </div></div>`;
}

function stories() {
  const all = eng.instancesFor(today());
  return `<div class="stories">${members().map(m => {
    const it = all.filter(x => x.member === m.id), dn = it.filter(x => x.done).length, p = it.length ? dn / it.length : 0;
    const C = 2 * Math.PI * 32, away = isAway(m);
    return `<button class="story ${it.length && dn === it.length ? 'full' : ''}" data-act="person" data-id="${m.id}">
      <div class="rw"><svg viewBox="0 0 70 70"><circle cx="35" cy="35" r="32" stroke="rgba(255,255,255,.1)" stroke-width="4" fill="none"/>
        <circle cx="35" cy="35" r="32" stroke="${esc(m.color)}" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}" style="transition:stroke-dashoffset .6s"/></svg>
        ${av(m)}${away ? '<span class="away">💼</span>' : ''}</div>
      <span class="nm">${m.id === me ? 'Tú' : esc(first(m))}</span><span class="ct">${away ? 'fuera' : it.length ? (dn === it.length ? '¡Cumplió! ✅' : `${dn}/${it.length}`) : 'libre'}</span></button>`;
  }).join('')}</div><div class="hint">Toca una foto para ver qué le toca hoy 👆</div>`;
}

function renderHoy() {
  const d = today(), mine = eng.instancesFor(d).filter(x => x.member === me), m = mById(me);
  const q = quoteNow();
  const pending = mine.filter(x => !x.done), finished = mine.filter(x => x.done);
  const pct = mine.length ? Math.round(finished.length / mine.length * 100) : 0;
  const msg = !mine.length ? '' : pct === 100 ? '¡Cumpliste! 🏆' : pct >= 50 ? 'Ya casi, ¡tú puedes! 💪' : pct > 0 ? '¡Buen arranque! 🚀' : '¡A darle! 🔥';
  $app.innerHTML = `
  <div class="top"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:30px">🏡</span><div class="brand">Nido<small>Casa en equipo</small></div></div>
    <button data-act="whoami">${av(m, 'lg')}</button></div>
  <div class="bigdate"><div class="num">${d.getDate()}</div><div><div class="wd">${d.toLocaleDateString('es-MX', { weekday: 'long' })}</div><div class="mo">${d.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' })}</div></div></div>
  ${db.mode === 'local' ? `<div class="banner">Modo demo: los datos viven solo en este teléfono. Conecta Firebase (ver guía) para que toda la casa comparta todo.</div>` : ''}
  ${houseRings()}
  <div class="card wis" id="wis" style="margin-top:14px">${wisHTML()}</div>
  <div class="stats">
    <div class="stat"><b>${eng.pointsBetween(me, weekStart(d), d)} ⭐</b><span>tus puntos esta semana</span></div>
    <div class="stat"><b>${eng.streak(me)} 🔥</b><span>días de racha</span></div>
  </div>
  <h2>Te toca hoy <small>${pending.length ? `${pending.length} pendiente${pending.length > 1 ? 's' : ''}` : ''}</small></h2>
  ${mine.length && !isAway(m) ? `<div class="pbar"><div class="pb"><i style="width:${pct}%"></i></div><div class="lb"><span><b>${finished.length} de ${mine.length}</b> · ${pct}%</span><span>${msg}</span></div></div>` : ''}
  ${isAway(m) ? `<div class="card empty" style="padding:18px"><div class="e">💼</div>Hoy estás marcado como fuera de casa. Tus turnos se pasaron a los demás.</div>`
    : mine.length ? pending.concat(finished).map(taskCard).join('') + (!pending.length ? `<div class="empty" style="padding:14px"><div class="e">🏆</div>¡Cumpliste con todo! Eres una máquina.</div>` : '')
    : `<div class="card empty"><div class="e">🌴</div>Hoy no te toca nada. ¡Día libre!</div>`}
  <div class="quote" style="margin-top:22px"><div class="lbl">Frase del momento</div><p>${esc(q)}</p></div>
  <h2>La casa hoy</h2>
  ${stories()}`;
}

function renderSemana() {
  const seg = `<div class="seg"><button data-act="wv" data-v="tabla" class="${ui.weekView !== 'mine' ? 'on' : ''}">📋 Plan de la casa</button><button data-act="wv" data-v="mine" class="${ui.weekView === 'mine' ? 'on' : ''}">👤 Mi semana</button></div>`;
  if (ui.weekView === 'mine') return renderMiSemana(seg);
  const t0 = today(), ws = addDays(weekStart(t0), 7 * (ui.weekOff || 0)), we = addDays(ws, 6);
  const days = [...Array(7)].map((_, i) => addDays(ws, i));
  const adm = isAdmin();
  const insts = days.map(d => eng.instancesFor(d));
  const fmtS = d => d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
  let rows = '';
  for (const t of db.cfg.tasks) {
    const slots = (t.times && t.times.length) ? t.times : [null];
    slots.forEach((time, si) => {
      const cells = days.map((d, di) => {
        const dk = keyOf(d), tod = d.getTime() === t0.getTime();
        if (t.mode === 'each') {
          const n = insts[di].filter(x => x.t.id === t.id && x.si === si);
          return `<td class="cl"><div class="pc ${tod ? 'tod' : ''} ${!n.length ? 'none' : ''}">${n.length ? `<span style="font-size:15px">👥</span>${n.every(x => x.done) ? '<span class="ck">✅</span>' : ''}` : ''}</div></td>`;
        }
        const x = insts[di].find(y => y.t.id === t.id && y.si === si);
        const act = adm ? `data-act="pcell" data-t="${t.id}" data-s="${si}" data-d="${dk}"` : `data-act="pview"`;
        if (!x) return `<td class="cl"><button class="pc none" ${act}></button></td>`;
        const m = mById(x.member);
        return `<td class="cl"><button class="pc ${tod ? 'tod' : ''} ${x.done ? 'ok' : ''} ${x.moved ? 'mv' : ''}" ${act}>${av(m)}${x.overridden ? '<span class="x"></span>' : ''}${x.done ? '<span class="ck">✅</span>' : ''}</button></td>`;
      }).join('');
      rows += `<tr><td class="tn">${esc(t.emoji)} ${esc(t.name)}${time ? ` <small>${time}</small>` : ''}</td>${cells}</tr>`;
    });
  }
  const load = members().map(m => { let n = 0, p = 0; insts.forEach(l => l.forEach(x => { if (x.member === m.id) { n++; p += +x.t.points || 0; } })); return { m, n, p }; });
  $app.innerHTML = `<h1>Semana</h1><div class="date">${adm ? 'Toca una casilla para asignar quién la hace' : 'El plan de la casa · lo organiza el admin'}</div>${seg}
  <div class="wnav"><button class="mini" data-act="woff" data-v="-1" aria-label="Semana anterior">‹</button><b>${ui.weekOff ? '' : 'Esta semana · '}${fmtS(ws)} – ${fmtS(we)}</b><button class="mini" data-act="woff" data-v="1" aria-label="Semana siguiente">›</button></div>
  <div class="card" style="padding:10px 8px;overflow:hidden"><table class="plan"><colgroup><col style="width:34%">${'<col>'.repeat(7)}</colgroup>
    <thead><tr><th></th>${days.map(d => `<th class="${d.getTime() === t0.getTime() ? 'tod' : ''}">${DOW[d.getDay()].slice(0, 2)}<b>${d.getDate()}</b></th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody></table></div>
  <div class="loads">${load.map(l => `<span>${av(l.m)}${esc(first(l.m))} · ${l.n} · ${l.p}⭐</span>`).join('')}</div>
  <div class="legend2">✅ hecha · <span style="color:#b9a8ff">●</span> cambio solo esta semana · <span style="color:#ffb547">▢</span> se movió porque alguien no está · 👥 cada quien la suya</div>
  ${adm && db.cfg.plan && Object.keys(db.cfg.plan).length ? '' : adm ? '<div class="banner" style="background:rgba(124,92,255,.12);border-color:rgba(124,92,255,.35);color:#d3c9ff">Ahorita la app reparte sola (rotación). En cuanto asignes una casilla "todas las semanas", esa tarea queda fija como tú la pongas.</div>' : ''}`;
}

function renderMiSemana(seg) {
  const t0 = today();
  let html = `<h1>Semana</h1><div class="date">Lo que te toca los próximos 7 días</div>${seg}`;
  for (let i = 0; i < 7; i++) {
    const d = addDays(t0, i);
    const it = eng.instancesFor(d).filter(x => x.member === me);
    html += `<div class="day"><h3 class="${i === 0 ? 'today' : ''}">${i === 0 ? 'Hoy · ' : i === 1 ? 'Mañana · ' : ''}${fmtDay(d)}</h3><div class="card" style="padding:4px 6px">
      ${it.length ? it.map(x => `<div class="wk ${x.done ? 'ok' : ''}"><span class="e">${esc(x.t.emoji)}</span><span class="n">${esc(x.t.name)}${x.time ? ` <span class="mut">· ${x.time}</span>` : ''}</span><span class="pill pts">+${x.t.points}</span></div>`).join('') : `<div class="wk mut">Libre 🌴</div>`}
    </div></div>`;
  }
  $app.innerHTML = html;
}

// Hoja para asignar una casilla (solo admin)
function planSheet(tid, si, dk) {
  const t = db.cfg.tasks.find(x => x.id === tid); if (!t) return;
  const d = fromKey(dk), base = `${dk}|${tid}|${si}`;
  const slots = (t.times && t.times.length) ? t.times : [null];
  const x = eng.instancesFor(d).find(y => y.t.id === tid && y.si === +si);
  let scope = 'all';
  const bg = sheet(`<h3>${esc(t.emoji)} ${esc(t.name)}${slots[si] ? ' · ' + slots[si] : ''}</h3>
    <p class="mut" style="margin:-8px 0 12px">${fmtDay(d)}${x ? ` · ahora: <b style="color:var(--txt)">${esc(mById(x.member).name)}</b>` : ' · ahora: no toca'}</p>
    <div class="seg" style="margin:0 0 12px"><button data-sc="all" class="on">🔁 Todos los ${DOW[d.getDay()].toLowerCase()}</button><button data-sc="week">📌 Solo este día</button></div>
    ${members().map(m => `<button class="opt" data-pick="${m.id}">${av(m, 'sm')} <span style="flex:1">${esc(m.name)}</span>${!eng.available(m, d) ? '<span class="away-tag">💼 no disponible</span>' : ''}${x && x.member === m.id ? ' ✓' : ''}</button>`).join('')}
    <button class="opt" data-pick="-">🚫 <span style="flex:1">No toca este día</span></button>
    ${x && x.overridden ? `<button class="opt" data-pick="reset">↩️ <span style="flex:1">Quitar el cambio de este día</span></button>` : ''}`);
  bg.querySelectorAll('[data-sc]').forEach(b => b.onclick = () => { scope = b.dataset.sc; bg.querySelectorAll('[data-sc]').forEach(o => o.classList.toggle('on', o === b)); });
  bg.querySelectorAll('[data-pick]').forEach(b => b.onclick = async () => {
    const v = b.dataset.pick;
    if (v === 'reset') { await store.setOverride(base, null); closeSheet(); return toast('Listo, regresó a lo planeado'); }
    if (scope === 'week') { await store.setOverride(base, v); closeSheet(); return toast(v === '-' ? 'Ese día no toca 🚫' : `Ese día le toca a ${first(mById(v))} 📌`); }
    const cfg = structuredClone(db.cfg); cfg.plan = cfg.plan || {};
    if (!cfg.plan[tid]) { // primera vez: se toma como base lo que hay esta semana
      const row = {}, ws = weekStart(d);
      for (let i = 0; i < 7; i++) { const dd = addDays(ws, i), l = eng.instancesFor(dd).filter(y => y.t.id === tid); row[dd.getDay()] = slots.map((_, k) => { const y = l.find(z => z.si === k); return y ? y.member : ''; }); }
      cfg.plan[tid] = row;
    }
    const dow = d.getDay(); const r = (cfg.plan[tid][dow] || slots.map(() => '')).slice();
    while (r.length < slots.length) r.push('');
    r[+si] = v === '-' ? '' : v; cfg.plan[tid][dow] = r;
    await store.saveConfig(cfg);
    if (x && x.overridden) await store.setOverride(base, null);
    closeSheet(); toast(v === '-' ? `Los ${DOW[dow].toLowerCase()} ya no toca 🚫` : `Todos los ${DOW[dow].toLowerCase()}: ${first(mById(v))} 🔁`);
  });
}

const RX = ['🔥', '👏', '💯', '😂'];
function renderFeed() {
  const list = [...db.comps.entries()].sort((a, b) => b[1].at - a[1].at).slice(0, 60);
  $app.innerHTML = `<h1>Actividad</h1><div class="date">Lo que la casa ha ido sacando</div><div style="height:16px"></div>
  ${list.length ? list.map(([k, r]) => { const m = mById(r.by), o = r.member !== r.by ? mById(r.member) : null, rx = r.rx || {};
    return `<div class="feed"><div class="hd">${av(m)}<div class="t"><b>${esc(m.name)}</b> terminó <b>${esc(r.emoji)} ${esc(r.taskName)}</b>${o ? ` y le hizo el paro a ${esc(first(o))} 💪` : ''}<div class="w">${ago(r.at)}</div></div><span class="pill pts">+${r.points}</span></div>
      <div class="rx">${RX.map(e => { const n = Object.values(rx).filter(v => v === e).length; return `<button class="${rx[me] === e ? 'me' : ''}" data-act="react" data-k="${esc(k)}" data-e="${e}">${e}${n ? `<small>${n}</small>` : ''}</button>`; }).join('')}</div></div>`; }).join('')
    : `<div class="card empty"><div class="e">✨</div>Todavía no hay actividad. ¡Estrénala tú!</div>`}`;
}

function weekReport() {
  const t = today(), ws = weekStart(t), st = db.cfg.startDate ? fromKey(db.cfg.startDate) : t;
  const from = ws < st ? st : ws, wsk = keyOf(ws);
  const rows = members().map(m => {
    const p = eng.progress(from, t, m.id);
    const pts = eng.pointsBetween(m.id, ws, t);
    const covers = [...db.comps.values()].filter(r => r.by === m.id && r.member !== m.id && r.date >= wsk).length;
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i), it = eng.instancesFor(d).filter(x => x.member === m.id), dn = it.filter(x => x.done).length;
      const lbl = DOW[d.getDay()].slice(0, 1);
      let c = '', tx = '';
      if (d > t || d < st) { c = 'f'; }
      else if (!eng.available(m, d)) { tx = '💼'; }
      else if (!it.length) { tx = '·'; }
      else if (dn === it.length) { c = 'g'; tx = '✓'; }
      else if (dn > 0) { c = 'y'; tx = `${dn}/${it.length}`; }
      else { c = d.getTime() === t.getTime() ? '' : 'r'; tx = d.getTime() === t.getTime() ? `0/${it.length}` : '✗'; }
      days.push(`<div>${lbl}<span class="${c}">${tx}</span></div>`);
    }
    return { m, pct: p.total ? p.done / p.total : 0, total: p.total, pts, covers, streak: eng.streak(m.id), days };
  }).sort((a, b) => b.pct - a.pct || b.pts - a.pts);
  // Insignias: todos reciben algo positivo
  const best = (k) => { const mx = Math.max(...rows.map(r => r[k])); return mx > 0 ? mx : Infinity; };
  const bPts = best('pts'), bStreak = best('streak'), bCov = best('covers');
  rows.forEach((r, i) => {
    r.badges = [];
    if (i === 0 && r.pct > 0) r.badges.push('👑 MVP de la semana');
    if (r.pts === bPts) r.badges.push('⭐ Más puntos');
    if (r.streak === bStreak) r.badges.push('🔥 Imparable');
    if (r.covers === bCov) r.badges.push('💪 Le hace el paro a todos');
    if (r.pct === 1 && r.total) r.badges.push('💯 Perfecto');
    if (!r.badges.length) r.badges.push(r.total ? '🚀 En remontada' : '🌴 Semana tranquila');
  });
  return rows;
}

function renderRanking() {
  const t = today();
  const g = db.cfg.goals || {};
  if (ui.rankRange === 'semana' || ui.rankRange === 'mes') {

function sheet(html) {

  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });

}
function closeSheet() { document.querySelectorAll('.sheetbg').forEach(e => e.remove()); }
const findInst = k => { const [y, mo, d] = k.split('|')[0].split('-').map(Number); eng.reset(); return eng.instancesFor(new Date(y, mo - 1, d)).find(x => x.key === k); };

function pickPhoto() {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
    i.onchange = () => {
      const f = i.files[0]; if (!f) return res(null);
      const img = new Image();
      img.onload = () => {
        const s = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = 240;
        c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 240, 240);
        URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', .8));
      };
      img.onerror = () => res(null);
      img.src = URL.createObjectURL(f);
    };
    i.click();
  });
}

const isStandalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const b64 = s => { const p = '='.repeat((4 - s.length % 4) % 4), r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
async function enablePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || typeof Notification === 'undefined') {
    return sheet(`<h3>🔔 Primero instala la app</h3><p class="mut" style="line-height:1.5">En iPhone las alertas solo funcionan con la app en la pantalla de inicio:<br><br>1. Abre este link en <b>Safari</b><br>2. Toca <b>Compartir</b> ⬆️<br>3. <b>Agregar a pantalla de inicio</b><br>4. Abre Nido desde el ícono y vuelve aquí.</p><button class="btn" data-act="close">Entendido</button>`);
  }
  if (db.mode !== 'remote' || !VAPID_PUBLIC) return toast('Falta conectar Firebase y el servidor de alertas (ver guía)');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') return toast('Permiso negado. Actívalo en Ajustes del iPhone → Notificaciones → Nido');
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID_PUBLIC) });
    await store.saveDevice(sub.toJSON(), me);
    localStorage.setItem('nido-push', '1'); toast('🔔 ¡Alertas activadas!'); render();
  } catch (e) { console.error(e); toast('No se pudieron activar las alertas'); }
}
async function resyncDevice() {
  if (localStorage.getItem('nido-push') !== '1' || db.mode !== 'remote' || !('serviceWorker' in navigator)) return;
  try { const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription(); if (sub) await store.saveDevice(sub.toJSON(), me); } catch {}
}

/* ================== Acciones ================== */
function celebrate() {
  const w = document.createElement('div'); w.className = 'win';
  w.innerHTML = `<div><div class="big">🏆</div><h1>¡Día completado!</h1><p>Llevas ${eng.streak(me)} 🔥 de racha. Así se hace.</p><button class="btn" style="max-width:260px">Va 😎</button></div>`;
  w.onclick = () => w.remove(); document.body.appendChild(w);
  confetti(); setTimeout(confetti, 500); SFX.win();
}
async function toggle(k) {
  const x = findInst(k); if (!x) return;
  if (x.done) { await store.uncomplete(k); toast('Desmarcada'); return; }
  const rec = { date: k.split('|')[0], task: x.t.id, taskName: x.t.name, emoji: x.t.emoji, slot: x.si, member: x.member, by: me, at: Date.now(), points: +x.t.points || 0 };
  await store.complete(k, rec);
  eng.reset();
  const left = eng.instancesFor(today()).filter(i => i.member === me && !i.done).length;
  if (left === 0 && rec.date === keyOf(today()) && x.member === me) celebrate();
  else { confetti(); SFX.done(); toast(`+${rec.points} ⭐ ¡Bien ahí!`); }
}

document.body.addEventListener('click', async e => {
  const el = e.target.closest('[data-act],[data-tab]'); if (!el) return;
  if (el.dataset.tab) { ui.tab = el.dataset.tab; window.scrollTo(0, 0); return render(); }
  const a = el.dataset.act, k = el.dataset.k;
  if (a === 'close') return closeSheet();
  if (a === 'pickme') { me = el.dataset.id; localStorage.setItem('nido-me', me); closeSheet(); toast(`¡Qué onda, ${first(mById(me))}!`); resyncDevice(); return render(); }
  if (a === 'whoami') return sheet(`<h3>¿Quién usa este teléfono?</h3>${members().map(m => `<button class="opt" data-act="pickme" data-id="${m.id}">${av(m)} ${esc(m.name)}${m.id === me ? ' ✓' : ''}</button>`).join('')}`);
  if (a === 'toggle') return toggle(k);
  if (a === 'tip') { ui.openTip = ui.openTip === k ? null : k; return render(); }
  if (a === 'wf') { ui.weekFilter = el.dataset.v; return render(); }
  if (a === 'wv') { ui.weekView = el.dataset.v; return render(); }
  if (a === 'woff') { ui.weekOff = Math.max(-4, Math.min(8, (ui.weekOff || 0) + +el.dataset.v)); return render(); }
  if (a === 'pcell') return planSheet(el.dataset.t, el.dataset.s, el.dataset.d);
  if (a === 'pview') return toast('Solo el admin puede cambiar el plan 🔒');
  if (a === 'planreset') {
    if (!el.dataset.sure) { el.dataset.sure = 1; el.textContent = 'Toca otra vez para confirmar'; return; }
    const cfg = structuredClone(db.cfg); delete cfg.plan; await store.saveConfig(cfg); return toast('🔄 De vuelta a la rotación automática');
  }
  if (a === 'rr') { ui.rankRange = el.dataset.v; return render(); }
  if (a === 'person') return personSheet(el.dataset.id);
  if (a === 'editm') return memberSheet(el.dataset.id);
  if (a === 'addm') return memberSheet(null);
  if (a === 'editt') return taskSheet(el.dataset.id);
  if (a === 'addt') return taskSheet(null);
  if (a === 'push') return enablePush();
  if (a === 'savequotes') {
    const cfg = structuredClone(db.cfg);
    cfg.quotes = document.getElementById('q-list').value.split('\n').map(x => x.trim()).filter(Boolean);
    cfg.reflect = document.getElementById('r-list').value.split('\n').map(x => x.trim()).filter(Boolean);
    await store.saveConfig(cfg); return toast('💬 Frases guardadas para toda la casa');
  }
  if (a === 'resetquotes') {
    if (!el.dataset.sure) { el.dataset.sure = 1; el.textContent = 'Toca otra vez para confirmar'; return; }
    const cfg = structuredClone(db.cfg); delete cfg.quotes; delete cfg.reflect;
    await store.saveConfig(cfg); return toast('Frases originales restauradas');
  }
  if (a === 'sfx') { localStorage.setItem('nido-sfx', sfxOn() ? '0' : '1'); if (sfxOn()) SFX.done(); return render(); }
  if (a === 'myphoto') { const p = await pickPhoto(); if (p) { await updateMember(me, m => ({ ...m, photo: p })); toast('📸 ¡Foto lista!'); } return; }
  if (a === 'savenotif') {
    const n = { morning: document.getElementById('n-am').value, evening: document.getElementById('n-pm').value, before: Math.max(0, +document.getElementById('n-bf').value || 0), done: document.getElementById('n-dn').value === '1' };
    await updateMember(me, m => ({ ...m, notif: n })); return toast('Horarios guardados ✓');
  }
  if (a === 'savegoals') { const cfg = structuredClone(db.cfg); cfg.goals = { week: document.getElementById('g-w').value.trim(), month: document.getElementById('g-m').value.trim(), mvp: document.getElementById('g-v').value.trim() }; await store.saveConfig(cfg); return toast('Metas guardadas 🎯'); }
  if (a === 'away') {
    const id = el.dataset.id, dk = keyOf(today()), min = keyOf(addDays(today(), -7));
    await updateMember(id, m => { const s = new Set((m.away || []).filter(d => d >= min)); s.has(dk) ? s.delete(dk) : s.add(dk); return { ...m, away: [...s] }; });
    closeSheet(); return toast('Listo, la rotación de hoy se reacomodó 🔄');
  }
  if (a === 'react') {
    const r = db.comps.get(k); if (!r) return;
    const cur = (r.rx || {})[me]; SFX.react(); return store.react(k, me, cur === el.dataset.e ? null : el.dataset.e);
  }
  if (a === 'other') {
    const x = findInst(k); if (!x) return;
    const m = mById(x.member), opts = [];
    opts.push(`<button class="opt" data-act="toggle-close" data-k="${k}">${x.done ? '↩️ Desmarcar' : x.member === me ? '✅ Marcar como hecha' : `💪 La hice yo (le hago el paro a ${esc(first(m))})`}</button>`);
    if (x.t.mode !== 'each') {
      opts.push(`<div class="mut" style="font-size:13px;margin:14px 4px 8px">Pasarle el turno a…</div>`);
      members().filter(mm => mm.id !== x.member).forEach(mm => opts.push(`<button class="opt" data-act="reassign" data-k="${x.base}" data-id="${mm.id}">${av(mm, 'sm')} ${esc(mm.name)}</button>`));
      if (x.overridden) opts.push(`<button class="opt" data-act="reassign" data-k="${x.base}" data-id="">🔄 Volver a lo planeado</button>`);
    }
    return sheet(`<h3>${esc(x.t.emoji)} ${esc(x.t.name)}</h3><p class="mut" style="margin:-8px 0 14px">Le toca a ${esc(m.name)}${x.time ? ' · ' + x.time : ''}</p>${opts.join('')}`);
  }
  if (a === 'toggle-close') { closeSheet(); return toggle(k); }
  if (a === 'reassign') { await store.setOverride(k, el.dataset.id || null); closeSheet(); toast(el.dataset.id ? `Ahora le toca a ${first(mById(el.dataset.id))}` : 'De vuelta a la rotación'); }
});

/* ================== Sonidos (generados, sin archivos) ================== */
let actx;
const sfxOn = () => localStorage.getItem('nido-sfx') !== '0';
function audio() {
  if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; actx = new AC(); }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freqs, dur = .12, type = 'sine', gap = .09, vol = .25) {
  const a = audio(); if (!a || !sfxOn()) return;
  let t = a.currentTime + .02;
  freqs.forEach(f => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + dur + .25);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .3); t += gap;
  });
}
const SFX = {
  done: () => tone([660, 880, 1320], .1, 'triangle', .08),          // tú terminas una tarea
  other: () => tone([784, 1047], .16, 'sine', .13, .2),            // alguien más termina
  win: () => tone([523, 659, 784, 1047, 784, 1319], .14, 'triangle', .1), // día completado
  react: () => tone([1200], .05, 'sine', 0, .12),
};
// iPhone solo deja sonar después del primer toque del usuario
['touchstart', 'click'].forEach(ev => document.addEventListener(ev, () => audio(), { once: true, passive: true }));

/* ================== Extras visuales ================== */
let toastT;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}
const fx = document.getElementById('fx'), ctx = fx.getContext('2d');
function confetti() {
  const W = fx.width = innerWidth * devicePixelRatio, H = fx.height = innerHeight * devicePixelRatio;
  fx.style.width = innerWidth + 'px'; fx.style.height = innerHeight + 'px';
  const cols = ['#7c5cff', '#22d3a6', '#ffb547', '#ff5fa2', '#3fb5ff', '#ffffff'];
  const P = Array.from({ length: 140 }, () => ({ x: W / 2, y: H * .55, vx: (Math.random() - .5) * 26 * devicePixelRatio, vy: (-Math.random() * 22 - 8) * devicePixelRatio, s: (Math.random() * 6 + 4) * devicePixelRatio, c: cols[Math.random() * cols.length | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .4 }));
  const t0 = performance.now();
  (function step(t) {
    ctx.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += .7 * devicePixelRatio; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t - t0 < 1800) requestAnimationFrame(step); else ctx.clearRect(0, 0, W, H);
  })(t0);
}

/* ================== Arranque ================== */
// Pantalla de presentación
(() => {
  const sp = document.getElementById('splash'); if (!sp) return;
  const hide = () => { sp.classList.add('hide'); setTimeout(() => sp.remove(), 800); };
  setTimeout(hide, 2800); sp.addEventListener('click', hide);
})();
onData = render;
notifyOther = r => { if (r.by !== me) { SFX.other(); if (navigator.vibrate) navigator.vibrate([40, 60, 40]); } if (r.by !== me) toast(`${mById(r.by).emoji} ${first(mById(r.by))} terminó ${r.emoji} ${r.taskName}`); };
render();
(async () => {
  if (FIREBASE_CONFIG) {
    try { store = remote; await remote.init(); resyncDevice(); }
    catch (err) { console.error(err); store = local; await local.init(); toast('No se pudo conectar; usando modo demo'); }
  } else await local.init();
})();
let lastDay = keyOf(today());
document.addEventListener('visibilitychange', () => { if (!document.hidden && keyOf(today()) !== lastDay) { lastDay = keyOf(today()); render(); } });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
